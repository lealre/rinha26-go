# Resource budget per the challenge: 1.0 CPU and 350 MB across ALL services.
#   lb   -> 0.10 CPU / 30 MB
#   api1 -> 0.45 CPU / 160 MB
#   api2 -> 0.45 CPU / 160 MB
#   total = 1.00 CPU / 350 MB
#
# Option D architecture: a custom Go LB (cmd/lb) listens on :9999, accepts
# each client TCP connection, and hands the raw file descriptor to one of
# the api workers via SCM_RIGHTS on a Unix control socket. After the
# handoff the workers read/write the client socket directly; the LB is out
# of the data path.

name: api

services:
  api1:
    build: .
    container_name: api1
    environment:
      GOMAXPROCS: "1"
      GOGC: "off"
      GOMEMLIMIT: "140MiB"
    command: ["--listen-fd=/var/run/rinha/api1-ctrl.sock"]
    volumes:
      - ./resources:/resources:ro
      - socket-dir:/var/run/rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/rinha/api1-ctrl.sock"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s
    networks:
      - rinha

  api2:
    build: .
    container_name: api2
    environment:
      GOMAXPROCS: "1"
      GOGC: "off"
      GOMEMLIMIT: "140MiB"
    command: ["--listen-fd=/var/run/rinha/api2-ctrl.sock"]
    volumes:
      - ./resources:/resources:ro
      - socket-dir:/var/run/rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/rinha/api2-ctrl.sock"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s
    networks:
      - rinha

  lb:
    build: .
    container_name: lb
    entrypoint: ["/usr/local/bin/lb"]
    command:
      - "--listen=:9999"
      - "--workers=/var/run/rinha/api1-ctrl.sock,/var/run/rinha/api2-ctrl.sock"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    volumes:
      - socket-dir:/var/run/rinha
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"
    networks:
      - rinha

volumes:
  socket-dir:

networks:
  rinha:
    driver: bridge
