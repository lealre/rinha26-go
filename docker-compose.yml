name: api

services:
  api1:
    build: .
    container_name: api1
    environment:
      GOMAXPROCS: "1"
    volumes:
      - ./resources:/resources:ro
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/ready"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 5s
    networks:
      - rinha

  api2:
    build: .
    container_name: api2
    environment:
      GOMAXPROCS: "1"
    volumes:
      - ./resources:/resources:ro
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/ready"]
      interval: 2s
      timeout: 1s
      retries: 60
      start_period: 5s
    networks:
      - rinha

  lb:
    image: nginx:1.27-alpine
    container_name: lb
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
